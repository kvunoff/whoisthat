[package]
name = "whoisthat-parser"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.22.1"
clap = { version = "4.4.6", features = ["derive"] }
dialoguer = "0.12.0"
http = "1.3.1"
querystring = "1.1.0"
serde = { version = "1.0.189", features = ["derive"] }
serde_json = "1.0.107"
serde_yaml = "0.9.34"
urlencoding = "2"
