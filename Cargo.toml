[package]
name = "whoisthat"
version = "0.16.2"
edition = "2021"
rust-version = "1.79"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
toml = "0.8"
directories = "5"
log = "0.4"
chrono = "0.4"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls"] }
