[package]
name = "whoisthat"
version = "0.19.1"
edition = "2024"
rust-version = "1.88"
default-run = "whoisthat"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
toml = "1.1"
directories = "6"
log = "0.4"
chrono = "0.4"
base64 = "0.23"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
