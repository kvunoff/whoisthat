name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned: -D warnings makes CI depend on the exact clippy version.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt check
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --no-deps -- -D warnings
      - name: Test
        run: cargo test
      - name: Security audit
        # Pinned musl build: no toolchain compile, no extra action permissions.
        run: |
          curl -sSfL https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz \
            | tar xz -C /tmp
          /tmp/cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit audit

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      # Threshold = measured baseline (38.5% lines) - 2.
      - name: Rust coverage
        run: cargo llvm-cov --lcov --output-path lcov.info --fail-under-lines 36
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: lcov.info

  msrv:
    name: Rust (MSRV)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The lowest toolchain we claim to support (Cargo.toml rust-version).
      # --all-targets is required: plain `check` skips tests and dev-deps.
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check on the declared minimum
        run: cargo check --all-targets --locked

  go:
    name: Go (vet + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          # Single source of truth: core/core/go.mod. Keeps CI and local
          # builds on the same toolchain instead of relying on GOTOOLCHAIN
          # auto-download.
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - name: gofmt
        working-directory: core/core
        run: test -z "$(gofmt -l .)"
      - name: vet
        working-directory: core/core
        run: go vet ./...
      - name: No silently ignored state errors
        working-directory: core/core
        run: |
          if grep -rn --include='*.go' --exclude='*_test.go' \
            -e '_ = proxy_manager.ReloadRouting' \
            -e '_ = cmd.DB.SetActiveRoutingProfile' \
            -e '_ = database.SetActiveRoutingProfile' \
            -e '_ = cmd.DB.SaveRoutingProfile' \
            -e '_ = database.SaveRoutingProfile' \
            -e '_ = db.updateGroup' \
            -e '_ = db.saveDBConfig' \
            -e '_ = os.Chmod(' \
            -e '_ = os.WriteFile(' \
            .; then
            echo 'error: swallowed state error (plan 2026-11-07, item 1)' >&2
            exit 1
          fi
      - name: Build
        working-directory: core/core
        run: go build ./...
      - name: Test
        # Run every package: routing (lib/proxy/mainproxy), Happ parsing
        # (lib/happ) and TUN script builders (lib/proxy/tun) are covered by
        # unit tests that the previous partial list skipped.
        working-directory: core/core
        run: go test -race -coverprofile=cover.out ./...
      - name: Coverage summary
        working-directory: core/core
        run: go tool cover -func=cover.out | tail -1
      - name: Coverage floor
        # Threshold = measured baseline (57%) - 2.
        working-directory: core/core
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
          awk -v t="$total" 'BEGIN { if (t+0 < 55) { print "coverage " t "% below 55%"; exit 1 } }'
      - uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: core/core/cover.out
      - name: Module tidiness
        working-directory: core/core
        run: go mod tidy -diff
      - name: Vulnerability scan
        working-directory: core/core
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  fuzz:
    name: Fuzz parsers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: go
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - name: Fuzz
        run: make test-fuzz

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debhelper devscripts dpkg-dev dput python3-paramiko
      - name: shellcheck
        run: shellcheck -S warning install.sh debian/postinst debian/preinst scripts/install.test.sh scripts/check-versions.sh scripts/check-docs.sh scripts/check-docs.test.sh scripts/bump.sh scripts/bump.test.sh scripts/release-upload.test.sh scripts/ipc-e2e.test.sh scripts/package.sh scripts/package/_common.sh scripts/package/aur.sh scripts/package/aur-bin.sh scripts/package/ppa.sh scripts/package.test.sh scripts/cgroup-setup scripts/cgroup-setup.test.sh scripts/run-core scripts/run-core.test.sh scripts/install-init scripts/install-init.test.sh scripts/init-hook pkg/init/openrc/whoisthat-cgroup pkg/init/openrc/whoisthat-core pkg/init/runit/core-services/10-whoisthat-cgroup.sh pkg/init/runit/whoisthat-core/run
      - name: install.sh tests
        run: ./scripts/install.test.sh
      - name: root helper tests (cgroup/run-core/install-init)
        run: |
          ./scripts/cgroup-setup.test.sh
          ./scripts/run-core.test.sh
          ./scripts/install-init.test.sh
      - name: check-docs.sh tests
        run: ./scripts/check-docs.test.sh
      - name: release upload policy tests
        run: ./scripts/release-upload.test.sh
      - name: packaging tests
        run: ./scripts/package.test.sh
      - name: PPA source package smoke
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/dist" "$tmp/files"
          for file in whoisthat whoisthat-core whoisthat.desktop \
            whoisthat-url.desktop whoisthat.svg LICENSE \
            whoisthat.bash _whoisthat whoisthat.fish whoisthat.1; do
            printf 'fixture\n' > "$tmp/files/$file"
          done
          tar -czf "$tmp/dist/whoisthat-linux-amd64.tar.gz" -C "$tmp/files" .
          tar -czf "$tmp/dist/whoisthat-linux-arm64.tar.gz" -C "$tmp/files" .
          ./scripts/package.sh ppa --dry-run --workdir "$tmp/work" \
            --artifacts "$tmp/dist" --series noble

          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)
          pkgrel=$(sed -n 's/^pkgrel=//p' pkg/aur/PKGBUILD | head -n1)
          src="$tmp/work/ppa/noble/whoisthat-$version"
          ( cd "$src" && dpkg-buildpackage -b -d -us -uc )
          deb="$tmp/work/ppa/noble/whoisthat_${version}-${pkgrel}~ubuntu24.04.1_amd64.deb"
          dpkg-deb -c "$deb" > "$tmp/deb.list"
          grep -q './usr/bin/whoisthat$' "$tmp/deb.list"
          grep -q './usr/bin/whoisthat-core$' "$tmp/deb.list"
          grep -q './usr/share/zsh/site-functions/_whoisthat$' "$tmp/deb.list"
          # dh_compress turns the man page into whoisthat.1.gz.
          grep -qE './usr/share/man/man1/whoisthat\.1(\.gz)?$' "$tmp/deb.list"

  bump:
    name: Bump script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test bump.sh
        run: ./scripts/bump.test.sh

  versions:
    name: Version consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check version mirrors
        run: ./scripts/check-versions.sh

  musl:
    name: Static musl build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          ( cd core/core && CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/whoisthat-core" )
          for bin in target/x86_64-unknown-linux-musl/release/whoisthat "$GITHUB_WORKSPACE/whoisthat-core"; do
            if readelf -l "$bin" | grep -q 'INTERP'; then
              echo "$bin is dynamically linked" >&2
              exit 1
            fi
          done

  docs:
    name: Docs build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: ./scripts/check-docs.sh

  ipc-e2e:
    name: IPC smoke (CLI <-> core)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - uses: Swatinem/rust-cache@v2
      - name: Build both binaries
        run: |
          cargo build --locked
          ( cd core/core && go build -o whoisthat-core )
      - name: Smoke test the IPC handshake
        run: make test-e2e

  integration:
    name: TUN/firewall integration (netns)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - name: Install network tools
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2
      - name: Run netns tests
        working-directory: core/core
        # Root is required for CLONE_NEWNET + TUN. Tests skip themselves when
        # the runner lacks /dev/net/tun or the needed privileges. The grep
        # guard fails the job if no TestNetns* was discovered at all.
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" "HOME=$HOME" \
            go test -tags=integration ./lib/proxy/tun/ -run '^TestNetns' -v | tee /tmp/netns.log
          grep -Eq -- '--- (PASS|SKIP): TestNetns' /tmp/netns.log
