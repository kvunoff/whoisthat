name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt check
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --no-deps
      - name: Test
        run: cargo test

  go:
    name: Go (vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Single source of truth: core/core/go.mod. Keeps CI and local
          # builds on the same toolchain instead of relying on GOTOOLCHAIN
          # auto-download.
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - name: gofmt
        working-directory: core/core
        run: test -z "$(gofmt -l .)"
      - name: vet
        working-directory: core/core
        run: go vet ./...
      - name: Build
        working-directory: core/core
        run: go build ./...
      - name: Test
        # Run every package: routing (lib/proxy/mainproxy), Happ parsing
        # (lib/happ) and TUN script builders (lib/proxy/tun) are covered by
        # unit tests that the previous partial list skipped.
        working-directory: core/core
        run: go test ./...
      - name: Module tidiness
        working-directory: core/core
        run: go mod tidy -diff
      - name: Vulnerability scan
        working-directory: core/core
        # Informational: transitive Xray/grpc advisories should not block a
        # release, but the report is visible in the job log.
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning install.sh scripts/install.test.sh scripts/check-versions.sh scripts/bump.sh scripts/bump.test.sh
      - name: install.sh tests
        run: ./scripts/install.test.sh

  bump:
    name: Bump script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test bump.sh
        run: ./scripts/bump.test.sh

  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version mirrors
        run: ./scripts/check-versions.sh

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run docs:build

  integration:
    name: TUN/firewall integration (netns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - name: Install network tools
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2
      - name: Run netns tests
        working-directory: core/core
        # Root is required for CLONE_NEWNET + TUN. Tests skip themselves when
        # the runner lacks /dev/net/tun or the needed privileges.
        run: sudo -E env "PATH=$PATH" "HOME=$HOME" go test -tags=integration ./lib/proxy/tun/ -run 'TestNetns' -v
