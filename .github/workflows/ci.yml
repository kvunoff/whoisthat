name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned: -D warnings makes CI depend on the exact clippy version.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt check
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --no-deps -- -D warnings
      - name: Test
        run: cargo test

  go:
    name: Go (vet + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          # Single source of truth: core/core/go.mod. Keeps CI and local
          # builds on the same toolchain instead of relying on GOTOOLCHAIN
          # auto-download.
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - name: gofmt
        working-directory: core/core
        run: test -z "$(gofmt -l .)"
      - name: vet
        working-directory: core/core
        run: go vet ./...
      - name: Build
        working-directory: core/core
        run: go build ./...
      - name: Test
        # Run every package: routing (lib/proxy/mainproxy), Happ parsing
        # (lib/happ) and TUN script builders (lib/proxy/tun) are covered by
        # unit tests that the previous partial list skipped.
        working-directory: core/core
        run: go test ./...
      - name: Module tidiness
        working-directory: core/core
        run: go mod tidy -diff
      - name: Vulnerability scan
        working-directory: core/core
        # Informational: transitive Xray/grpc advisories should not block a
        # release, but the report is visible in the job log.
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -S warning install.sh scripts/install.test.sh scripts/check-versions.sh scripts/check-docs.sh scripts/check-docs.test.sh scripts/bump.sh scripts/bump.test.sh scripts/release-upload.test.sh pkg/package-postinstall.sh
      - name: install.sh tests
        run: ./scripts/install.test.sh
      - name: check-docs.sh tests
        run: ./scripts/check-docs.test.sh
      - name: release upload policy tests
        run: ./scripts/release-upload.test.sh

  bump:
    name: Bump script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test bump.sh
        run: ./scripts/bump.test.sh

  versions:
    name: Version consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check version mirrors
        run: ./scripts/check-versions.sh

  musl:
    name: Static musl build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          ( cd core/core && CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/whoisthat-core" )
          for bin in target/x86_64-unknown-linux-musl/release/whoisthat "$GITHUB_WORKSPACE/whoisthat-core"; do
            if readelf -l "$bin" | grep -q 'INTERP'; then
              echo "$bin is dynamically linked" >&2
              exit 1
            fi
          done

  docs:
    name: Docs build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: ./scripts/check-docs.sh

  integration:
    name: TUN/firewall integration (netns)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - name: Install network tools
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2
      - name: Run netns tests
        working-directory: core/core
        # Root is required for CLONE_NEWNET + TUN. Tests skip themselves when
        # the runner lacks /dev/net/tun or the needed privileges. The grep
        # guard fails the job if no TestNetns* was discovered at all.
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" "HOME=$HOME" \
            go test -tags=integration ./lib/proxy/tun/ -run '^TestNetns' -v | tee /tmp/netns.log
          grep -Eq -- '--- (PASS|SKIP): TestNetns' /tmp/netns.log
