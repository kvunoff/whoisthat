name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt check
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --no-deps
      - name: Test
        run: cargo test

  go:
    name: Go (vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Single source of truth: core/core/go.mod. Keeps CI and local
          # builds on the same toolchain instead of relying on GOTOOLCHAIN
          # auto-download.
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - name: vet
        working-directory: core/core
        run: go vet ./...
      - name: Build
        working-directory: core/core
        run: go build ./...
      - name: Test
        # Run every package: routing (lib/proxy/mainproxy), Happ parsing
        # (lib/happ) and TUN script builders (lib/proxy/tun) are covered by
        # unit tests that the previous partial list skipped.
        working-directory: core/core
        run: go test ./...
