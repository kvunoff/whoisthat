name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-lint:
    name: Rust / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned: -D warnings makes CI depend on the exact clippy version.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt check
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --no-deps --locked -- -D warnings
      - name: Security audit
        # Prebuilt cargo-audit: no toolchain compile. Pinned; bump deliberately.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit

  rust-test:
    name: Rust / test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # Prebuilt cargo-llvm-cov; pinned, bump deliberately.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # llvm-cov runs the test suite itself, so there is no separate `cargo test`.
      # The crate has no [lib] target: doc-tests do not run. Add `--doctests`
      # here if a library target ever appears.
      #
      # Threshold = measured baseline (38.5% lines) - 2.
      - name: Rust coverage
        run: cargo llvm-cov --locked --lcov --output-path lcov.info --fail-under-lines 36
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: lcov.info
          retention-days: 7

  rust-msrv:
    name: Rust / msrv
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The lowest toolchain we claim to support (Cargo.toml rust-version).
      # --all-targets is required: plain `check` skips tests and dev-deps.
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check on the declared minimum
        run: cargo check --all-targets --locked

  go-lint:
    name: Go / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          # Single source of truth: core/core/go.mod. Keeps CI and local
          # builds on the same toolchain instead of relying on GOTOOLCHAIN
          # auto-download.
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - name: gofmt
        working-directory: core/core
        run: test -z "$(gofmt -l .)"
      - name: vet
        working-directory: core/core
        run: go vet ./...
      - name: No silently ignored state errors
        run: ./scripts/check-swallowed-errors.sh
      - name: Build
        working-directory: core/core
        run: go build ./...
      - name: Module tidiness
        working-directory: core/core
        run: go mod tidy -diff

  go-test:
    name: Go / test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - name: Test
        # Run every package: routing (lib/proxy/mainproxy), Happ parsing
        # (lib/happ) and TUN script builders (lib/proxy/tun) are covered by
        # unit tests that a partial list would skip. -shuffle catches
        # order-dependent tests.
        working-directory: core/core
        run: go test -race -shuffle=on -coverprofile=cover.out ./...
      - name: Coverage summary
        working-directory: core/core
        run: go tool cover -func=cover.out | tail -1
      - name: Coverage floor
        # Threshold = measured baseline (57%) - 2.
        working-directory: core/core
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
          awk -v t="$total" 'BEGIN { if (t+0 < 55) { print "coverage " t "% below 55%"; exit 1 } }'
      - uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: core/core/cover.out
          retention-days: 7

  go-vuln:
    name: Go / vuln
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - name: Vulnerability scan
        working-directory: core/core
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  fuzz:
    name: Go / fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - name: Fuzz
        run: make test-fuzz

  hygiene:
    name: Repo / hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: shellcheck
        run: ./scripts/lint-shell.sh
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check version mirrors
        run: ./scripts/check-versions.sh

  scripts-test:
    name: Scripts / tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run script tests
        run: ./scripts/run-tests.sh

  package-smoke:
    name: Package / ppa smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debhelper devscripts dpkg-dev
      - name: PPA source package smoke
        run: ./scripts/ppa-smoke.sh

  docs:
    name: Docs / build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: ./scripts/check-docs.sh

  musl:
    name: Build / musl
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - name: Install musl toolchain
        run: ./scripts/install-musl.sh
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          ( cd core/core && CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/whoisthat-core" )
      - name: Assert static
        run: |
          ./scripts/check-static.sh \
            target/x86_64-unknown-linux-musl/release/whoisthat \
            "$GITHUB_WORKSPACE/whoisthat-core"

  ipc-e2e:
    name: E2E / ipc
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - uses: Swatinem/rust-cache@v2
      - name: Build both binaries
        run: |
          cargo build --locked
          ( cd core/core && go build -o whoisthat-core )
      - name: Smoke test the IPC handshake
        run: make test-e2e

  standalone-core-e2e:
    name: E2E / standalone core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - run: make core test-core-e2e

  integration:
    name: E2E / netns
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum
      - name: Install network tools
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2
      - name: Run netns tests
        env:
          # Root is required for CLONE_NEWNET + TUN. An all-SKIP run (no
          # /dev/net/tun, or a renamed test) must not pass as green.
          REQUIRE_NETNS: '1'
        run: ./scripts/netns-test.sh
