name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag vX.Y.Z to attach assets to (builds that tag, never the branch)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # Always build the tag itself. A dispatch must never attach binaries built
  # from a branch to an existing tag. Do not reference env.TAG here: GitHub
  # does not resolve one env entry from another in the same map.
  SOURCE_REF: ${{ format('refs/tags/{0}', github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name) }}

jobs:
  verify:
    name: Verify release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Validate dispatch tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TARGET_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "inputs.tag must look like vX.Y.Z (got '${TARGET_TAG}')" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum

      - name: Rust tests
        run: cargo test

      - name: Go vet and tests
        working-directory: core/core
        run: |
          go vet ./...
          go test -race ./...

  build:
    name: Build ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-musl
            deb_arch: amd64
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      # Needed by actions/attest-build-provenance only.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Verify tag against version files
        run: ./scripts/check-versions.sh --tag "$TAG"

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/core/go.mod
          cache-dependency-path: core/core/go.sum

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build static binaries
        env:
          TARGET: ${{ matrix.target }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          mkdir -p dist
          ( cd core/core && CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o "$GITHUB_WORKSPACE/dist/whoisthat-core" )
          cargo build --release --locked --target "$TARGET"
          cp "target/$TARGET/release/whoisthat" dist/whoisthat
          cp pkg/whoisthat.desktop dist/
          cp LICENSE dist/

          check_static() {
            if readelf -l "$1" | grep -q 'INTERP'; then
              echo "$1 is dynamically linked; musl build failed" >&2
              exit 1
            fi
          }
          check_static dist/whoisthat
          check_static dist/whoisthat-core

      - name: Create archives
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p stage/bundle stage/core
          cp dist/whoisthat dist/whoisthat-core dist/whoisthat.desktop dist/LICENSE stage/bundle/
          cp dist/whoisthat-core dist/LICENSE stage/core/
          tar -czf "dist/whoisthat-linux-${ARCH}.tar.gz" -C stage/bundle \
            whoisthat whoisthat-core whoisthat.desktop LICENSE
          tar -czf "dist/whoisthat-core-linux-${ARCH}.tar.gz" -C stage/core \
            whoisthat-core LICENSE

      - name: Build deb and rpm
        env:
          ARCH: ${{ matrix.arch }}
          ARTIFACT_DIR: ${{ github.workspace }}/dist
        run: |
          set -euo pipefail
          export VERSION
          export PKGREL
          VERSION=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)
          PKGREL=$(sed -n 's/^pkgrel=//p' pkg/aur/PKGBUILD)
          # nfpm needs a newer Go than the tag's go.mod may pin; setup-go
          # exports GOTOOLCHAIN=local, so opt this tool install back in.
          GOTOOLCHAIN=auto go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          gopath_bin="$(go env GOPATH)/bin"
          export PATH="$gopath_bin:$PATH"
          nfpm package --config pkg/nfpm.yaml --packager deb --target dist/
          nfpm package --config pkg/nfpm.yaml --packager rpm --target dist/

      - name: Smoke test packages
        env:
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist:/dist:ro" debian:12 sh -c \
            "export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y -qq /dist/whoisthat_*_${DEB_ARCH}.deb && whoisthat --version && whoisthat-core --version"
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:44 sh -c \
            "dnf install -y -q /dist/whoisthat-*.${RPM_ARCH}.rpm && whoisthat --version && whoisthat-core --version"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CORE_VERSION=$(sed -n 's/^const CoreVersion = "\([^"]*\)"$/\1/p' core/core/lib/version/version.go | head -n1)
          CORE_TAG="core-v${CORE_VERSION}"
          echo "CORE_TAG=${CORE_TAG}" >> "$GITHUB_ENV"

          mkdir -p release/bundle release/core
          cp dist/whoisthat-linux-*.tar.gz dist/whoisthat_*.deb dist/whoisthat-*.rpm release/bundle/
          cp dist/whoisthat-core-linux-*.tar.gz release/core/
          ( cd release/bundle && sha256sum -- * > SHA256SUMS )
          ( cd release/core && sha256sum -- * > SHA256SUMS )

          ensure_release() {
            local tag=$1
            if ! gh release view "$tag" >/dev/null 2>&1; then
              echo "Release ${tag} is missing; creating a draft"
              gh release create "$tag" --draft --verify-tag \
                --title "$tag" --generate-notes
            fi
          }

          # Drafts are replaceable. A published release is immutable: attach
          # missing assets and never overwrite an existing one. Content is not
          # hash-compared: tar/gzip and deb/rpm archives embed build timestamps,
          # so a rebuilt archive never matches byte-for-byte.
          # (tested by scripts/release-upload.test.sh)
          upload_assets() {
            local tag=$1 dir=$2
            local published asset name

            if [ "$(gh release view "$tag" --json isDraft -q .isDraft)" = "true" ]; then
              gh release upload "$tag" "$dir"/* --clobber
              return 0
            fi

            published=$(gh release view "$tag" --json assets -q '.assets[].name')

            for asset in "$dir"/*; do
              name=$(basename "$asset")
              if printf '%s\n' "$published" | grep -Fxq "$name"; then
                echo "asset ${name} already published; leaving it untouched"
              else
                echo "attaching missing asset ${name} to published release ${tag}"
                gh release upload "$tag" "$asset"
                ATTACHED=1
              fi
            done
          }

          # Rebuild SHA256SUMS from the assets that are actually in a
          # published release (existing files + anything just attached). Only
          # runs after a backfill; an unchanged file is not re-uploaded.
          refresh_sums() {
            local tag=$1 dir=$2 tmp released
            tmp=$(mktemp -d)
            gh release download "$tag" --dir "$tmp" >/dev/null
            released="$tmp/SHA256SUMS"
            ( cd "$tmp" && rm -f SHA256SUMS && sha256sum -- * ) > "$dir/SHA256SUMS"
            if [ -f "$released" ] && cmp -s "$released" "$dir/SHA256SUMS"; then
              echo "SHA256SUMS for ${tag} unchanged"
            else
              echo "refreshing SHA256SUMS for ${tag}"
              gh release upload "$tag" "$dir/SHA256SUMS" --clobber
            fi
            rm -rf "$tmp"
          }

          ensure_release "$CORE_TAG"
          ensure_release "$TAG"

          # A TUI-only release reuses an already published core-v* release;
          # upload_assets verifies it and skips it instead of overwriting.
          ATTACHED=0
          upload_assets "$CORE_TAG" release/core
          upload_assets "$TAG" release/bundle

          # A backfill into a published release needs a matching SHA256SUMS;
          # otherwise install.sh refuses the newly attached file.
          if [ "$ATTACHED" -eq 1 ]; then
            for pair in "$CORE_TAG:release/core" "$TAG:release/bundle"; do
              tag=${pair%%:*}
              dir=${pair#*:}
              if [ "$(gh release view "$tag" --json isDraft -q .isDraft)" = "false" ]; then
                refresh_sums "$tag" "$dir"
              fi
            done
          fi

          # Verify provenance before publishing the drafts.
          for f in dist/whoisthat-linux-*.tar.gz dist/whoisthat-core-linux-*.tar.gz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done

          latest_v_tag() {
            gh release list --exclude-drafts --limit 100 --json tagName -q '.[].tagName' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n1
          }
          LATEST_BEFORE=$(latest_v_tag || true)

          publish_if_draft() {
            local tag=$1
            if [ "$(gh release view "$tag" --json isDraft -q .isDraft)" = "true" ]; then
              gh release edit "$tag" --draft=false
            fi
          }
          publish_if_draft "$CORE_TAG"
          publish_if_draft "$TAG"

          # core-v* must never steal Latest from the bundle release.
          if [ "$LATEST_BEFORE" = "$TAG" ] ||
             [ "$(printf '%s\n%s\n' "${LATEST_BEFORE:-0.0.0}" "$TAG" | sort -V | tail -n1)" = "$TAG" ]; then
            gh release edit "$TAG" --latest
          fi

  aur-bin:
    name: Publish whoisthat-bin to AUR
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Setup SSH
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          printf '%s\n' \
            'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            HostName aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            User aur
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Update and push PKGBUILD
        run: |
          set -euo pipefail

          TMP=$(mktemp -d)
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key -o StrictHostKeyChecking=yes" \
            git clone ssh://aur@aur.archlinux.org/whoisthat-bin.git "$TMP"

          VERSION=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)
          AUR_VER=$(sed -n 's/^pkgver=//p' "$TMP/PKGBUILD")
          AUR_REL=$(sed -n 's/^pkgrel=//p' "$TMP/PKGBUILD")
          if [ "$AUR_VER" = "$VERSION" ]; then
            PKGREL=$((AUR_REL + 1))
          else
            PKGREL=1
          fi
          echo "Publishing whoisthat-bin ${VERSION}-${PKGREL}"

          SHA_AMD64=$(sha256sum dist/whoisthat-linux-amd64.tar.gz | awk '{print $1}')
          SHA_ARM64=$(sha256sum dist/whoisthat-linux-arm64.tar.gz | awk '{print $1}')

          cp pkg/aur-bin/PKGBUILD "$TMP/PKGBUILD"
          cp pkg/aur-bin/whoisthat-bin.install "$TMP/whoisthat-bin.install"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" "$TMP/PKGBUILD"
          sed -i "s/^pkgrel=.*/pkgrel=${PKGREL}/" "$TMP/PKGBUILD"
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${SHA_AMD64}')/" "$TMP/PKGBUILD"
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${SHA_ARM64}')/" "$TMP/PKGBUILD"

          (
            cd "$TMP"
            # shellcheck disable=SC1091
            source PKGBUILD
            {
              echo "pkgbase = ${pkgname}"
              echo -e "\tpkgdesc = ${pkgdesc}"
              echo -e "\tpkgver = ${pkgver}"
              echo -e "\tpkgrel = ${pkgrel}"
              echo -e "\turl = ${url}"
              echo -e "\tinstall = ${install}"
              for a in "${arch[@]}"; do echo -e "\tarch = ${a}"; done
              echo -e "\tlicense = ${license[0]}"
              for dep in "${provides[@]}"; do echo -e "\tprovides = ${dep}"; done
              for dep in "${conflicts[@]}"; do echo -e "\tconflicts = ${dep}"; done
              for dep in "${depends[@]}"; do echo -e "\tdepends = ${dep}"; done
              for dep in "${optdepends[@]}"; do echo -e "\toptdepends = ${dep}"; done
              for opt in "${options[@]}"; do echo -e "\toptions = ${opt}"; done
              for a in "${arch[@]}"; do
                declare -n srcs="source_${a}"
                declare -n sums="sha256sums_${a}"
                for s in "${srcs[@]}"; do echo -e "\tsource_${a} = ${s}"; done
                for s in "${sums[@]}"; do echo -e "\tsha256sums_${a} = ${s}"; done
              done
              echo
              echo "pkgname = ${pkgname}"
            } > .SRCINFO
          )

          git -C "$TMP" config user.email "ci@github-actions"
          git -C "$TMP" config user.name "GitHub Actions"
          git -C "$TMP" add -A
          git -C "$TMP" commit -m "v${VERSION}-${PKGREL}: update package" || {
            echo "AUR is already up to date"
            rm -rf "$TMP"
            exit 0
          }
          git -C "$TMP" push
          rm -rf "$TMP"

  install-smoke:
    name: Installer smoke (${{ matrix.image }})
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            prep: apt-get update -qq && apt-get install -y -qq curl ca-certificates
          - image: ubuntu:24.04
            prep: apt-get update -qq && apt-get install -y -qq curl ca-certificates
          - image: fedora:44
            prep: dnf install -y -q curl ca-certificates tar
          - image: archlinux:latest
            prep: pacman -Sy --noconfirm curl ca-certificates tar
    container:
      image: ${{ matrix.image }}
      # File capabilities on whoisthat-core need these in the bounding set.
      options: --cap-add=NET_ADMIN --cap-add=NET_RAW --cap-add=SETPCAP
    defaults:
      run:
        shell: bash
    steps:
      - name: Install fetch tooling
        run: ${{ matrix.prep }}

      - name: Install from the published release
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/install.sh" -o /tmp/install.sh
          bash /tmp/install.sh --release "$TAG"
          whoisthat --version
          whoisthat-core --version
