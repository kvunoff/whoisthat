name: Publish to AUR

on:
  push:
    tags:
      - 'v*'

jobs:
  aur-publish:
    runs-on: ubuntu-latest

    steps:
      # --- 1. Checkout the source repository --------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- 2. Parse version from the tag ------------------------------------
      - name: Parse version from tag
        id: version
        run: |
          RAW="${{ github.ref_name }}"
          VERSION="${RAW#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${RAW}  ->  Version: ${VERSION}"

      # --- 3. Setup SSH -----------------------------------------------------
      - name: Setup SSH
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write the key — printf avoids newline issues from GitHub Secrets
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key

          # Verify the key looks like a private key
          head -1 ~/.ssh/aur_key

          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            HostName aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            User aur
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

          # Test the connection
          ssh -vT aur@aur.archlinux.org 2>&1 | tail -5 || true

      # --- 4. Clone AUR repo, compute pkgrel --------------------------------
      - name: Compute pkgrel from AUR state
        id: pkgrel
        run: |
          TMP=$(mktemp -d)
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key -o StrictHostKeyChecking=accept-new" \
            git clone ssh://aur@aur.archlinux.org/whoisthat.git "$TMP"

          AUR_VER=$(grep '^pkgver=' "$TMP/PKGBUILD" | cut -d= -f2)
          AUR_REL=$(grep '^pkgrel=' "$TMP/PKGBUILD" | cut -d= -f2)
          NEW_VER="${{ steps.version.outputs.version }}"

          if [ "${AUR_VER}" = "${NEW_VER}" ]; then
            PKGREL=$(( AUR_REL + 1 ))
            echo "AUR pkgver=${AUR_VER} matches → bump pkgrel ${AUR_REL} -> ${PKGREL}"
          else
            PKGREL=1
            echo "New version ${NEW_VER} (was ${AUR_VER}) → pkgrel=1"
          fi

          echo "pkgrel=${PKGREL}" >> "$GITHUB_OUTPUT"
          rm -rf "$TMP"

      # --- 5. Update PKGBUILD -----------------------------------------------
      - name: Update PKGBUILD
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKGREL="${{ steps.pkgrel.outputs.pkgrel }}"

          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" pkg/aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=${PKGREL}/"   pkg/aur/PKGBUILD

          echo "=== PKGBUILD ==="
          cat pkg/aur/PKGBUILD

      # --- 6. Regenerate .SRCINFO (Arch container) --------------------------
      - name: Regenerate .SRCINFO
        uses: docker://archlinux:latest
        with:
          args: >
            bash -c "
              pacman -Sy --noconfirm base-devel &&
              cd /github/workspace/pkg/aur &&
              sudo -u nobody makepkg --printsrcinfo > .SRCINFO
            "

      - name: Show .SRCINFO
        run: |
          echo "=== .SRCINFO ==="
          cat pkg/aur/.SRCINFO

      # --- 7. Push to AUR ---------------------------------------------------
      - name: Push to AUR
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKGREL="${{ steps.pkgrel.outputs.pkgrel }}"

          TMP=$(mktemp -d)
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key -o StrictHostKeyChecking=accept-new" \
            git clone ssh://aur@aur.archlinux.org/whoisthat.git "$TMP"
          cp pkg/aur/PKGBUILD          "$TMP/"
          cp pkg/aur/.SRCINFO          "$TMP/"
          cp pkg/aur/whoisthat.install "$TMP/"

          git -C "$TMP" config user.email "ci@github-actions"
          git -C "$TMP" config user.name  "GitHub Actions"

          git -C "$TMP" add -A
          git -C "$TMP" commit -m "v${VERSION}-${PKGREL}: update package" || {
            echo "Nothing to commit — AUR is already up to date."
            rm -rf "$TMP"
            exit 0
          }
          git -C "$TMP" push
          rm -rf "$TMP"
          echo "Pushed v${VERSION}-${PKGREL} to AUR"
