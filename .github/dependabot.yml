version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      rust:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Exact pin: =4.6.7 in Cargo.toml, bumped deliberately.
      - dependency-name: clap

  - package-ecosystem: gomod
    directory: /core/core
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      go:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Must stay in step with xraymgr.PinnedVersion (v26.10.29).
      - dependency-name: github.com/xtls/xray-core

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      docs:
        patterns: ["*"]
