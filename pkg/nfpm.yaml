name: whoisthat
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${PKGREL}
section: net
priority: optional
maintainer: kvunoff <kvunoff@proton.me>
description: Modern terminal-based VPN client with Xray-core backend
vendor: WhoisThat
homepage: https://github.com/kvunoff/whoisthat
license: MIT

contents:
  - src: ${ARTIFACT_DIR}/whoisthat
    dst: /usr/bin/whoisthat
    expand: true
  - src: ${ARTIFACT_DIR}/whoisthat-core
    dst: /usr/bin/whoisthat-core
    expand: true
  - src: ${ARTIFACT_DIR}/whoisthat-runner
    dst: /usr/bin/whoisthat-runner
    expand: true
  - src: ${ARTIFACT_DIR}/lib/whoisthat/cgroup-setup
    dst: /usr/lib/whoisthat/cgroup-setup
    expand: true
  - src: ${ARTIFACT_DIR}/lib/whoisthat/run-runner
    dst: /usr/lib/whoisthat/run-runner
    expand: true
  - src: ${ARTIFACT_DIR}/lib/whoisthat/run-core
    dst: /usr/lib/whoisthat/run-core
    expand: true
  - src: ${ARTIFACT_DIR}/lib/whoisthat/install-init
    dst: /usr/lib/whoisthat/install-init
    expand: true
  - src: ${ARTIFACT_DIR}/lib/whoisthat/init-hook
    dst: /usr/lib/whoisthat/init-hook
    expand: true
  - src: ${ARTIFACT_DIR}/lib/whoisthat/init/openrc/whoisthat-cgroup
    dst: /usr/lib/whoisthat/init/openrc/whoisthat-cgroup
    expand: true
  - src: ${ARTIFACT_DIR}/lib/whoisthat/init/openrc/whoisthat-core
    dst: /usr/lib/whoisthat/init/openrc/whoisthat-core
    expand: true
  - src: ${ARTIFACT_DIR}/lib/whoisthat/init/openrc/whoisthat-runner
    dst: /usr/lib/whoisthat/init/openrc/whoisthat-runner
    expand: true
  - src: ${ARTIFACT_DIR}/lib/whoisthat/init/dinit/whoisthat-cgroup
    dst: /usr/lib/whoisthat/init/dinit/whoisthat-cgroup
    expand: true
  - src: ${ARTIFACT_DIR}/lib/whoisthat/init/dinit/whoisthat-core
    dst: /usr/lib/whoisthat/init/dinit/whoisthat-core
    expand: true
  - src: ${ARTIFACT_DIR}/lib/whoisthat/init/dinit/whoisthat-runner
    dst: /usr/lib/whoisthat/init/dinit/whoisthat-runner
    expand: true
  - src: ${ARTIFACT_DIR}/lib/whoisthat/init/runit/core-services/10-whoisthat-cgroup.sh
    dst: /usr/lib/whoisthat/init/runit/core-services/10-whoisthat-cgroup.sh
    expand: true
  - src: ${ARTIFACT_DIR}/lib/whoisthat/init/runit/whoisthat-core/run
    dst: /usr/lib/whoisthat/init/runit/whoisthat-core/run
    expand: true
  - src: ${ARTIFACT_DIR}/lib/whoisthat/init/runit/whoisthat-runner/run
    dst: /usr/lib/whoisthat/init/runit/whoisthat-runner/run
    expand: true
  - src: ${ARTIFACT_DIR}/whoisthat.desktop
    dst: /usr/share/applications/whoisthat.desktop
    expand: true
  - src: ${ARTIFACT_DIR}/whoisthat-url.desktop
    dst: /usr/share/applications/whoisthat-url.desktop
    expand: true
  - src: ${ARTIFACT_DIR}/whoisthat.svg
    dst: /usr/share/icons/hicolor/scalable/apps/whoisthat.svg
    expand: true
  - src: ${ARTIFACT_DIR}/LICENSE
    dst: /usr/share/licenses/whoisthat/LICENSE
    expand: true
  - src: ${ARTIFACT_DIR}/whoisthat.bash
    dst: /usr/share/bash-completion/completions/whoisthat
    expand: true
  - src: ${ARTIFACT_DIR}/_whoisthat
    dst: /usr/share/zsh/site-functions/_whoisthat
    expand: true
  - src: ${ARTIFACT_DIR}/whoisthat.fish
    dst: /usr/share/fish/vendor_completions.d/whoisthat.fish
    expand: true
  - src: ${ARTIFACT_DIR}/whoisthat.1
    dst: /usr/share/man/man1/whoisthat.1
    expand: true

scripts:
  postinstall: debian/postinst

depends:
  - iproute2
  - nftables
  - libcap2-bin

overrides:
  rpm:
    depends:
      - iproute
      - nftables
      - libcap
